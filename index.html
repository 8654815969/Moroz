<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Честный Отзыв - Платформа для честных отзывов о товарах</title>
    <style>
        /* Сюда идут все ваши стили из обоих файлов (можно оставить только из большего, т.к. они охватывают всё, а из меньшего уникальные элементы, типа .referral-tree, .empty-state, .copy-btn - добавить) */
        /* ... ВСТАВИТЬ СТИЛИ из КОДА 1 ... */
        /* ... и ДОПОЛНИТЕЛЬНЫЕ СТИЛИ из КОДА 2 ниже: */
        .copy-btn {
            background: var(--primary);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 500;
        }
        .copy-btn:hover { background: var(--primary-dark); }
        .referral-tree {
            margin-top: 2rem;
        }
        .tree-item {
            background: white;
            border-left: 3px solid var(--primary);
            padding: 1rem;
            margin-bottom: 0.5rem;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .tree-item-name {
            font-weight: 600;
            color: var(--text);
        }
        .tree-item-email {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo">
                <div class="logo-icon">⭐</div>
                <span>Честный Отзыв</span>
            </div>
            <nav>
                <a onclick="showSection('home')">Главная</a>
                <a onclick="showSection('verified')">Проверенные товары</a>
                <a onclick="showSection('catalog')">Каталог</a>
                <a onclick="showSection('cabinet')" id="cabinetLink" style="display: none;">Личный кабинет</a>
                <a onclick="showSection('referrals')" id="referralsLink" style="display: none;">Рефералы</a>
                <a id="adminNavLink" onclick="showSection('admin')" style="display: none;">Админ</a> <!-- из большого файла -->
            </nav>
            <div class="auth-buttons">
                <button class="btn btn-secondary btn-small" id="loginBtn" onclick="toggleLoginModal()">Вход</button>
                <button class="btn btn-primary btn-small" id="registerBtn" onclick="toggleRegisterModal()">Регистрация</button>
                <button class="btn btn-danger btn-small" id="logoutBtn" style="display:none;" onclick="logout()">Выход</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- ... Home, Verified, Catalog, Cabinet, Referrals, Admin sections ... -->
        <!-- Переписываем секцию cabinet/referral так, чтобы в ней появлялось дерево и реф статистика -->
        <!-- Вынести UI из меньшего и большего в одну общую секцию: -->
        <!-- ... ВСТАВИТЕ СОДЕРЖИМОЕ MAIN из основного кода, для секции #cabinet участок UI/разметку взять из меньшего кода, т.е. с деревом и stats ...  -->
        <!-- ... Если что, в #cabinet можно оставить и tabs, и stats, и дерево, и ссылки - ничего не потеряется -->
        <!-- ... Все прочие секции из большого кода оставить как есть, так как они уникальны по логике -->
        
        <!-- Остальной основной HTML как есть без изменений ... -->

    </main>
    
    <!-- ... Модалки login/register/etc ... -->
    <!-- Firebase Module (type="module" обязательно) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, setDoc, doc, addDoc, onSnapshot, query, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIz*****Jg",
    authDomain: "saintmarketology.firebaseapp.com",
    projectId: "saintmarketology",
    storageBucket: "saintmarketology.appspot.com",
    messagingSenderId: "1098681326401",
    appId: "1:1098681326401:web:3a28423a30b92be88d1fc0"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Делаем firebase в глобальный scope
window.firebase = {
    auth,
    db,
    collection,
    getDocs,
    setDoc,
    doc,
    addDoc,
    onSnapshot,
    query,
    where,
    updateDoc,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
};

let currentUser = null;
window.currentUser = null; // для локальных скриптов

// --- Listen to auth state changes ---
onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    window.currentUser = user;
    updateAuthUI();
    if (user) await loadUserData();
});

// Получить url параметры (реф ссылка!)
function getUrlParams(){
    const params = new URLSearchParams(window.location.search);
    return { ref: params.get("ref") };
}

// Загрузить профиль пользователя из Firestore
async function loadUserData() {
    if (!currentUser) return;
    try {
        const userDoc = await getDocs(query(collection(db, 'users'), where('uid', '==', currentUser.uid)));
        if (!userDoc.empty) {
            const userData = userDoc.docs[0].data();
            window.currentUserData = userData;
            updateCabinetUI(userData);
        }
    } catch (e) { console.error('Ошибка профиля:', e);}
}

// UI кабинета и дерева рефералов
function updateCabinetUI(userData) {
    document.getElementById('userName').textContent = userData.name || 'Пользователь';
    document.getElementById('userEmail').textContent = userData.email || '';
    document.getElementById('userAvatar').textContent = (userData.name || 'У')[0].toUpperCase();
    document.getElementById('referralLink').textContent = `${window.location.origin}${window.location.pathname}?ref=${userData.referralCode}`;
    document.getElementById('referralCount').textContent = userData.referralCount || 0;
    document.getElementById('referralPoints').textContent = userData.referralPoints || 0;
    document.getElementById('conversionRate').textContent = (userData.referralCount||0)>0?'100%':'0%';
    loadReferralTree(userData.referralCode);
}

// Дерево рефералов
async function loadReferralTree(referralCode) {
    try {
        const q = query(collection(db, 'users'), where('referrerCode', '==', referralCode));
        const referrals = await getDocs(q);
        const container = document.getElementById('referralTreeContainer');
        if (referrals.empty) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">👥</div>
                    <p>Ваши приглашенные друзья будут отображаться здесь</p>
                    <p style="font-size: 0.85rem; margin-top: 0.5rem;">Пока у вас нет активных рефералов</p>
                </div>
            `;
        } else {
            container.innerHTML = Array.from(referrals.docs).map(doc=>{
                const data = doc.data();
                return `
                    <div class="tree-item">
                        <div class="tree-item-name">${data.name}</div>
                        <div class="tree-item-email">${data.email}</div>
                    </div>
                `;
            }).join('');
        }
    } catch (e) {
        document.getElementById('referralTreeContainer').innerHTML = "Ошибка загрузки дерева рефералов";
        console.error(e);
    }
}

// Переключение между авторизацией и личным кабинетом
function updateAuthUI() {
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const cabinetLink = document.getElementById('cabinetLink');
    const referralsLink = document.getElementById('referralsLink');
    const notLoggedInMessage = document.getElementById('notLoggedInMessage');
    const cabinetContent = document.getElementById('cabinetContent');

    if (currentUser) {
        loginBtn.style.display = 'none';
        registerBtn.style.display = 'none';
        logoutBtn.style.display = 'block';
        cabinetLink.style.display = 'block';
        referralsLink.style.display = 'block';
        notLoggedInMessage.style.display = 'none';
        cabinetContent.style.display = 'block';
    } else {
        loginBtn.style.display = 'block';
        registerBtn.style.display = 'block';
        logoutBtn.style.display = 'none';
        cabinetLink.style.display = 'none';
        referralsLink.style.display = 'none';
        notLoggedInMessage.style.display = 'flex';
        cabinetContent.style.display = 'none';
    }
}

// --- AUTH HANDLING (вызывать напрямую из form onsubmit) ---
window.handleLogin = async function(event) {
    event.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    try {
        await signInWithEmailAndPassword(auth, email, password);
        toggleLoginModal();
        alert('Успешный вход!');
    } catch (error) {
        alert('Ошибка входа: ' + error.message);
    }
};

window.handleRegister = async function(event) {
    event.preventDefault();
    const name = document.getElementById('registerName').value;
    const email = document.getElementById('registerEmail').value;
    const password = document.getElementById('registerPassword').value;
    const referralCode = document.getElementById('referralCode')?.value || getUrlParams().ref || null;

    try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        const newReferralCode = 'REF' + Math.random().toString(36).substr(2, 9).toUpperCase();
        await setDoc(doc(db, 'users', user.uid), {
            uid: user.uid,
            name, email,
            referralCode: newReferralCode,
            referrerCode: referralCode || null,
            referralCount: 0, referralPoints: 0,
            createdAt: new Date(), updatedAt: new Date()
        });

        // Если вписан рефкод, обновляем у того, кто пригласил статистику
        if (referralCode) {
            const referrerQuery = query(collection(db, 'users'), where('referralCode', '==', referralCode));
            const referrerDocs = await getDocs(referrerQuery);
            if (!referrerDocs.empty) {
                const referrerDoc = referrerDocs.docs[0];
                const referrerData = referrerDoc.data();
                await updateDoc(doc(db, 'users', referrerDoc.id), {
                    referralCount: (referrerData.referralCount || 0) + 1,
                    referralPoints: (referrerData.referralPoints || 0) + 50,
                    updatedAt: new Date()
                });
            }
        }
        toggleRegisterModal();
        alert('Успешная регистрация!');
    } catch (error) {
        alert('Ошибка регистрации: ' + error.message);
    }
};

// --- LOGOUT --- 
window.logout = async function() {
    try {
        await signOut(auth);
        currentUser = null;
        updateAuthUI();
        showSection('home');
        alert('Вы вышли из аккаунта');
    } catch (error) {
        alert('Ошибка выхода: ' + error.message);
    }
};
</script>
<!-- Local Functions, UI, Tabs, Notifications, Copy link, etc. -->
<script>
// --- Универсальное переключение секций ---
function showSection(sectionId) {
    if ((sectionId === 'cabinet' || sectionId === 'referrals') && !window.currentUser) {
        alert('Пожалуйста, авторизуйтесь');
        return;
    }
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(sectionId).classList.add('active');
    // для админки, тянем ваши функции из "большого" файла
    if(sectionId === 'admin' && typeof updateAdmin === 'function') updateAdmin();
    if(sectionId === 'catalog' && typeof renderProducts === 'function') renderProducts();
    if(sectionId === 'verified' && typeof renderVerifiedProducts === 'function') renderVerifiedProducts();
    // для кабинета, если функции есть
    if(sectionId === 'cabinet' && typeof updateCabinet === 'function') updateCabinet();
}

// Для открытия и закрытия модалок — общий подход
function toggleLoginModal() {
    document.getElementById('loginModal').classList.toggle('active');
}
function toggleRegisterModal() {
    document.getElementById('registerModal').classList.toggle('active');
}

// --- Копирование реферальной ссылки ---
function copyReferralLink() {
    const link = document.getElementById('referralLink').textContent;
    if (navigator.clipboard) {
        navigator.clipboard.writeText(link).then(()=>{ showMiniAlert('Ссылка скопирована!','success'); });
    } else {
        // fallback
        alert('Скопируйте ссылку вручную:\n' + link);
    }
}

// --- Mini-alert like в меньшем коде, но в стиле большего ---
function showMiniAlert(msg,type){
    let alert = document.createElement('div');
    alert.className = 'alert alert-'+(type||'success');
    alert.textContent = msg;
    alert.style.position = 'fixed';
    alert.style.top = '80px';
    alert.style.right = '20px';
    alert.style.zIndex = '2000';
    alert.style.maxWidth = '400px';
    document.body.appendChild(alert);
    setTimeout(()=>alert.remove(), 3000);
}

// --- Закрытие модалок по клику по фону ---
document.querySelectorAll('.modal').forEach(modal => {
    modal.addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });
});

// --- Для tabs если используется (например, в admin) ---
window.switchTab = function(tabName) {
    document.querySelectorAll('#cabinet .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('#cabinet .tab-content').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(tabName).classList.add('active');
}
window.switchAdminTab = function(tabName) {
    document.querySelectorAll('#admin .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('#admin .tab-content').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(tabName + '-admin').classList.add('active');
}

// --- Пример переноса старых функций уведомлений (оставить на всякий случай) ---
function showSuccessMessage(msg){ showMiniAlert(msg, 'success'); }
function showErrorMessage(msg){ showMiniAlert(msg, 'error'); }

// --- Фильтр поиска по товарам (если есть renderProducts / renderVerifiedProducts) ---
document.addEventListener('DOMContentLoaded', ()=>{
    if(document.getElementById('searchInput') && typeof renderProducts === 'function')
        document.getElementById('searchInput').addEventListener('input', renderProducts);
    if(document.getElementById('verifiedSearchInput') && typeof renderVerifiedProducts === 'function')
        document.getElementById('verifiedSearchInput').addEventListener('input', renderVerifiedProducts);

    // Обработка реф ссылки через URL (для уведомления)
    const params = new URLSearchParams(window.location.search);
    if(params.has('ref')){
        showMiniAlert('🎉 Вы пришли по реферальной ссылке!','success');
    }
});
</script>
