<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getAuth, 
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { 
        getFirestore,
        doc, 
        setDoc, 
        getDoc,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc,
        collection,
        query,
        where,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ===== Firebase Config =====
    const firebaseConfig = {
        apiKey: "AIzaSyAPaV-LlEBjl-alwt3mawWtAKYFF5uuyJg",
        authDomain: "saintmarketology.firebaseapp.com",
        projectId: "saintmarketology",
        storageBucket: "saintmarketology.firebasestorage.app",
        messagingSenderId: "1098681326401",
        appId: "1:1098681326401:web:3a28423a30b92be88d1fc0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ===== Данные =====
    let currentUser = null;
    let currentUserData = null;

    let products = [
        { id: 1, name: 'Беспроводные наушники', category: 'electronics', description: 'Высокачественные наушники с шумоподавлением', url: 'https://example.com/1', image: null, rating: 4.5, reviews: 12, stock: 10 },
        { id: 2, name: 'Кофеварка', category: 'home', description: 'Автоматическая кофеварка на 12 чашек', url: 'https://example.com/2', image: null, rating: 4.8, reviews: 8, stock: 5 },
        { id: 3, name: 'Фитнес трекер', category: 'sports', description: 'Умный браслет для отслеживания активности', url: 'https://example.com/3', image: null, rating: 4.3, reviews: 20, stock: 15 }
    ];

    let verifiedProducts = [
        { id: 101, name: 'iPhone 15 Pro', category: 'electronics', description: 'Флагманский смартфон Apple', price: 999, stock: 15, url: 'https://example.com/iphone', image: null, rating: 4.9, reviews: 150 },
        { id: 102, name: 'MacBook Pro', category: 'electronics', description: 'Мощный ноутбук для профессионалов', price: 1999, stock: 8, url: 'https://example.com/macbook', image: null, rating: 4.8, reviews: 200 },
        { id: 103, name: 'Samsung Galaxy S24', category: 'electronics', description: 'Премиум Android смартфон', price: 899, stock: 20, url: 'https://example.com/samsung', image: null, rating: 4.7, reviews: 180 }
    ];

    let reviews = [];
    let commissions = [];
    let productRequests = [];

    // ===== URL Params =====
    function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        return { ref: params.get('ref') };
    }

    // ===== AUTH =====

    // Следим за состоянием входа
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            // Получаем данные пользователя из Firestore
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            if (userDoc.exists()) {
                currentUserData = userDoc.data();
            }
            updateHeader();
        } else {
            currentUser = null;
            currentUserData = null;
            updateHeader();
        }
    });

    // РЕГИСТРАЦИЯ
    window.handleRegister = async function(e) {
        e.preventDefault();
        
        const name = document.getElementById('registerName').value;
        const email = document.getElementById('registerEmail').value;
        const password = document.getElementById('registerPassword').value;
        
        try {
            // Создаём пользователя в Firebase Auth
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            
            // Проверяем реферальный код
            const urlParams = getUrlParams();
            let referrerId = null;
            let referrerName = null;

            if (urlParams.ref) {
                // Ищем реферрера в Firestore
                const usersRef = collection(db, 'users');
                const q = query(usersRef, where('referralCode', '==', urlParams.ref));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    const referrerDoc = querySnapshot.docs[0];
                    referrerId = referrerDoc.id;
                    referrerName = referrerDoc.data().name;
                }
            }
            
            // Генерируем реферальный код
            const referralCode = 'REF' + Math.random().toString(36).substr(2, 9).toUpperCase();
            
            // Определяем роль
            const isAdmin = email === 'marketology2019@mail.ru';
            
            // Сохраняем в Firestore
            const userData = {
                name,
                email,
                role: isAdmin ? 'admin' : 'user',
                referralCode,
                referrerId: referrerId || null,
                points: 0,
                reviewsCount: 0,
                productsCount: 0,
                createdAt: new Date().toISOString()
            };
            
            await setDoc(doc(db, 'users', user.uid), userData);
            currentUserData = userData;
            
            // Закрываем модал
            document.getElementById('registerModal').classList.remove('active');
            document.querySelector('#registerModal form').reset();
            
            if (referrerName) {
                showSuccessMessage(`✅ Вы зарегистрировались по реферальной ссылке от ${referrerName}!`);
            } else {
                showSuccessMessage('🎉 Вы успешно зарегистрировались!');
            }

        } catch (error) {
            console.error(error);
            if (error.code === 'auth/email-already-in-use') {
                showErrorMessage('❌ Пользователь с таким email уже существует');
            } else if (error.code === 'auth/weak-password') {
                showErrorMessage('❌ Пароль должен быть не менее 6 символов');
            } else {
                showErrorMessage('❌ Ошибка регистрации: ' + error.message);
            }
        }
    }

    // ВХОД
    window.handleLogin = async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        
        try {
            await signInWithEmailAndPassword(auth, email, password);
            
            document.getElementById('loginModal').classList.remove('active');
            document.querySelector('#loginModal form').reset();
            showSuccessMessage('✅ Вы успешно вошли!');

        } catch (error) {
            console.error(error);
            if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
                showErrorMessage('❌ Неверный email или пароль');
            } else {
                showErrorMessage('❌ Ошибка входа: ' + error.message);
            }
        }
    }

    // ВЫХОД
    window.logout = async function() {
        await signOut(auth);
        showSuccessMessage('👋 Вы вышли из аккаунта');
        showSection('home');
    }

    // ===== ОБНОВЛЕНИЕ ШАПКИ =====
    window.updateHeader = function() {
        const authButtons = document.querySelector('.auth-buttons');
        const adminNavLink = document.getElementById('adminNavLink');
        
        if (currentUser && currentUserData) {
            authButtons.innerHTML = `
                <div class="flex gap-2" style="align-items: center;">
                    <div class="user-avatar" style="width: 32px; height: 32px; font-size: 0.9rem;">
                        ${currentUserData.name.charAt(0)}
                    </div>
                    <span style="color: white;">${currentUserData.name}</span>
                </div>
            `;
            
            if (currentUserData.role === 'admin') {
                adminNavLink.style.display = 'block';
            } else {
                adminNavLink.style.display = 'none';
            }
        } else {
            authButtons.innerHTML = `
                <button class="btn btn-secondary btn-small" onclick="toggleLoginModal()">Вход</button>
                <button class="btn btn-primary btn-small" onclick="toggleRegisterModal()">Регистрация</button>
            `;
            adminNavLink.style.display = 'none';
        }
    }

    // ===== ЛИЧНЫЙ КАБИНЕТ =====
    window.updateCabinet = async function() {
        if (!currentUser || !currentUserData) {
            document.getElementById('notLoggedInMessage').style.display = 'block';
            document.getElementById('cabinetContent').style.display = 'none';
            return;
        }
        
        document.getElementById('notLoggedInMessage').style.display = 'none';
        document.getElementById('cabinetContent').style.display = 'block';
        
        // Обновляем данные из Firestore
        const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
        if (userDoc.exists()) {
            currentUserData = userDoc.data();
        }
        
        document.getElementById('userName').textContent = currentUserData.name;
        document.getElementById('userEmail').textContent = currentUserData.email;
        document.getElementById('userAvatar').textContent = currentUserData.name.charAt(0);
        document.getElementById('productsCount').textContent = currentUserData.productsCount || 0;
        document.getElementById('reviewsCount').textContent = currentUserData.reviewsCount || 0;
        document.getElementById('pointsCount').textContent = currentUserData.points || 0;
        document.getElementById('avgRating').textContent = '0★';
        
        // Реферальная ссылка
        const referralLink = `${window.location.origin}${window.location.pathname}?ref=${currentUserData.referralCode}`;
        document.getElementById('referralLink').textContent = referralLink;
        
        // Загружаем рефералов
        await loadReferrals();
        
        // Загружаем запросы
        await loadUserRequests();
        
        // Загружаем комиссии
        await loadUserCommissions();
    }

    // Загружаем рефералов
    async function loadReferrals() {
        try {
            const usersRef = collection(db, 'users');
            const q = query(usersRef, where('referrerId', '==', currentUser.uid));
            const snapshot = await getDocs(q);
            
            const referralsList = document.getElementById('referralsList');
            if (snapshot.empty) {
                referralsList.innerHTML = '<p class="text-muted">Вы ещё никого не пригласили</p>';
            } else {
                referralsList.innerHTML = snapshot.docs.map(doc => {
                    const data = doc.data();
                    return `
                        <div class="card mb-2">
                            <div class="flex-between">
                                <div>
                                    <h4 class="card-title">${data.name}</h4>
                                    <p class="text-muted">${data.email}</p>
                                </div>
                                <span class="badge badge-success">Реферал</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        } catch (error) {
            console.error('Ошибка загрузки рефералов:', error);
        }
    }

    // Загружаем запросы пользователя
    async function loadUserRequests() {
        try {
            const requestsRef = collection(db, 'requests');
            const q = query(requestsRef, where('userId', '==', currentUser.uid));
            const snapshot = await getDocs(q);
            
            const requestsList = document.getElementById('requestsList');
            if (snapshot.empty) {
                requestsList.innerHTML = '<p class="text-muted">Вы ещё не запрашивали товары</p>';
            } else {
                requestsList.innerHTML = snapshot.docs.map(doc => {
                    const r = doc.data();
                    const product = products.find(p => p.id === r.productId);
                    return `
                        <div class="card mb-2">
                            <div class="flex-between">
                                <div>
                                    <h4 class="card-title">${product?.name || 'Товар'}</h4>
                                    <p class="text-muted">Способ: ${r.paymentMethod === 'card' ? '💳 Карта банка' : '⏰ Через 3 дня'}</p>
                                </div>
                                <span class="request-status ${r.status}">
                                    ${r.status === 'pending' ? '⏳ Ожидание' : r.status === 'approved' ? '✅ Одобрено' : '❌ Отклонено'}
                                </span>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        } catch (error) {
            console.error('Ошибка загрузки запросов:', error);
        }
    }

    // Загружаем комиссии пользователя
    async function loadUserCommissions() {
        try {
            const commissionsRef = collection(db, 'commissions');
            const q = query(commissionsRef, where('referrerId', '==', currentUser.uid));
            const snapshot = await getDocs(q);
            
            let total = 0, paid = 0;
            
            const commissionsList = document.getElementById('commissionsList');
            if (snapshot.empty) {
                commissionsList.innerHTML = '<p class="text-muted">Комиссии отсутствуют</p>';
            } else {
                const items = [];
                snapshot.docs.forEach(doc => {
                    const c = doc.data();
                    total += c.amount || 0;
                    if (c.paid) paid += c.amount || 0;
                    
                    const product = verifiedProducts.find(p => p.id === c.productId);
                    items.push(`
                        <div class="card mb-2">
                            <div class="flex-between">
                                <div>
                                    <h4 class="card-title">${product?.name || 'Товар'}</h4>
                                </div>
                                <div>
                                    <div style="font-weight: bold;">$${(c.amount || 0).toFixed(2)}</div>
                                    <span class="badge ${c.paid ? 'badge-success' : 'badge-warning'}">
                                        ${c.paid ? 'Выплачено' : 'Ожидание'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    `);
                });
                commissionsList.innerHTML = items.join('');
            }
            
            document.getElementById('totalCommission').textContent = '$' + total.toFixed(2);
            document.getElementById('paidCommission').textContent = '$' + paid.toFixed(2);
            document.getElementById('unpaidCommission').textContent = '$' + (total - paid).toFixed(2);

        } catch (error) {
            console.error('Ошибка загрузки комиссий:', error);
        }
    }

    // ===== ЗАПРОСЫ ТОВАРОВ =====
    window.submitProductRequest = async function(productId, paymentMethod) {
        if (!currentUser) return;
        
        const product = products.find(p => p.id === productId);
        
        try {
            await addDoc(collection(db, 'requests'), {
                userId: currentUser.uid,
                userName: currentUserData.name,
                productId: productId,
                productName: product.name,
                paymentMethod: paymentMethod,
                category: product.category,
                status: 'pending',
                date: new Date().toISOString()
            });
            
            // Увеличиваем счётчик
            await updateDoc(doc(db, 'users', currentUser.uid), {
                productsCount: (currentUserData.productsCount || 0) + 1
            });
            
            document.getElementById('requestProductModal').classList.remove('active');
            showSuccessMessage(`✅ Запрос на товар "${product.name}" отправлен!`);
            
        } catch (error) {
            console.error(error);
            showErrorMessage('❌ Ошибка при отправке запроса');
        }
    }

    // ===== ADMIN =====
    window.updateAdmin = async function() {
        if (!currentUser || !currentUserData || currentUserData.role !== 'admin') {
            document.getElementById('adminNotification').style.display = 'block';
            document.getElementById('adminContent').style.display = 'none';
            return;
        }
        
        document.getElementById('adminNotification').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        
        // Загружаем пользователей
        const usersSnapshot = await getDocs(collection(db, 'users'));
        const usersList = document.getElementById('usersList');
        usersList.innerHTML = usersSnapshot.docs.map(doc => {
            const u = doc.data();
            return `
                <div class="card mb-2">
                    <div class="flex-between">
                        <div>
                            <h4 class="card-title">${u.name}</h4>
                            <p class="text-muted">${u.email}</p>
                            <p class="text-muted" style="font-size:0.8rem;">Реф. код: ${u.referralCode}</p>
                        </div>
                        <span class="badge badge-primary">${u.role}</span>
                    </div>
                </div>
            `;
        }).join('');

        // Загружаем запросы
        const requestsSnapshot = await getDocs(collection(db, 'requests'));
        const adminRequestsList = document.getElementById('adminRequestsList');
        if (requestsSnapshot.empty) {
            adminRequestsList.innerHTML = '<p class="text-muted">Нет запросов</p>';
        } else {
            adminRequestsList.innerHTML = requestsSnapshot.docs.map(docSnap => {
                const r = docSnap.data();
                return `
                    <div class="card mb-2">
                        <div class="flex-between">
                            <div>
                                <h4 class="card-title">${r.productName}</h4>
                                <p class="text-muted">От: ${r.userName}</p>
                                <p class="text-muted">Способ: ${r.paymentMethod === 'card' ? '💳 Карта' : '⏰ Через 3 дня'}</p>
                            </div>
                            <div class="action-buttons">
                                <button class="btn btn-success btn-small" onclick="approveRequest('${docSnap.id}')">✅</button>
                                <button class="btn btn-danger btn-small" onclick="rejectRequest('${docSnap.id}')">❌</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Рендерим товары (локальные)
        renderAdminProducts();
        renderAdminVerifiedProducts();
    }

    // Одобрить/отклонить запрос
    window.approveRequest = async function(requestId) {
        await updateDoc(doc(db, 'requests', requestId), { status: 'approved' });
        showSuccessMessage('✅ Запрос одобрен!');
        updateAdmin();
    }

    window.rejectRequest = async function(requestId) {
        await updateDoc(doc(db, 'requests', requestId), { status: 'rejected' });
        showSuccessMessage('❌ Запрос отклонён!');
        updateAdmin();
    }

    function renderAdminProducts() {
        const adminProductsList = document.getElementById('adminProductsList');
        adminProductsList.innerHTML = products.map(p => `
            <div class="card mb-2">
                <div class="flex-between">
                    <div>
                        <h4 class="card-title">${p.name}</h4>
                        <p class="text-muted">${p.category} | Остаток: ${p.stock}</p>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-warning btn-small" onclick="openEditProductModal(${p.id})">✏️</button>
                        <button class="btn btn-danger btn-small" onclick="deleteProduct(${p.id})">🗑️</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderAdminVerifiedProducts() {
        const adminVerifiedProductsList = document.getElementById('adminVerifiedProductsList');
        adminVerifiedProductsList.innerHTML = verifiedProducts.map(p => `
            <div class="card mb-2">
                <div class="flex-between">
                    <div>
                        <h4 class="card-title">${p.name}</h4>
                        <p class="text-muted">$${p.price} | Остаток: ${p.stock}</p>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-warning btn-small" onclick="openEditVerifiedProductModal(${p.id})">✏️</button>
                        <button class="btn btn-danger btn-small" onclick="deleteVerifiedProduct(${p.id})">🗑️</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // ===== ОСТАЛЬНЫЕ ФУНКЦИИ (без изменений) =====

    window.showSection = function(sectionId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(sectionId).classList.add('active');
        
        if (sectionId === 'catalog') renderProducts();
        else if (sectionId === 'verified') renderVerifiedProducts();
        else if (sectionId === 'cabinet') updateCabinet();
        else if (sectionId === 'admin') updateAdmin();
    }

    window.toggleLoginModal = function() {
        document.getElementById('loginModal').classList.toggle('active');
    }
    window.toggleRegisterModal = function() {
        document.getElementById('registerModal').classList.toggle('active');
    }
    window.toggleAddProductModal = function() {
        document.getElementById('addProductModal').classList.toggle('active');
    }
    window.toggleAddVerifiedProductModal = function() {
        document.getElementById('addVerifiedProductModal').classList.toggle('active');
    }
    window.closeEditProductModal = function() {
        document.getElementById('editProductModal').classList.remove('active');
    }
    window.closeEditVerifiedProductModal = function() {
        document.getElementById('editVerifiedProductModal').classList.remove('active');
    }
    window.closePaymentModal = function() {
        document.getElementById('paymentModal').classList.remove('active');
    }
    window.closeRequestProductModal = function() {
        document.getElementById('requestProductModal').classList.remove('active');
    }

    window.renderProducts = function() {
        const grid = document.getElementById('productGrid');
        const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
        const filtered = products.filter(p => 
            p.name.toLowerCase().includes(searchTerm) || 
            p.description.toLowerCase().includes(searchTerm)
        );
        grid.innerHTML = filtered.map(p => `
            <div class="card position-relative">
                ${p.stock <= 5 ? `<div class="stock-badge ${p.stock === 0 ? 'out' : 'low'}">Осталось: ${p.stock}</div>` : `<div class="stock-badge">В наличии: ${p.stock}</div>`}
                <div class="product-image">${p.image ? `<img src="${p.image}" alt="${p.name}">` : '📦'}</div>
                <h3 class="card-title">${p.name}</h3>
                <p class="card-content">${p.description}</p>
                <div class="rating mb-2">${'⭐'.repeat(Math.floor(p.rating))}${'☆'.repeat(5-Math.floor(p.rating))}</div>
                <p class="text-muted" style="font-size: 0.9rem;">${p.reviews} отзывов</p>
                <div class="card-footer">
                    <button class="btn btn-primary btn-small" onclick="showRequestProductOptions(${p.id})" ${p.stock === 0 ? 'disabled' : ''}>Запросить</button>
                </div>
            </div>
        `).join('');
    }

    window.renderVerifiedProducts = function() {
        const grid = document.getElementById('verifiedProductGrid');
        const searchTerm = document.getElementById('verifiedSearchInput')?.value.toLowerCase() || '';
        const filtered = verifiedProducts.filter(p => 
            p.name.toLowerCase().includes(searchTerm) || 
            p.description.toLowerCase().includes(searchTerm)
        );
        grid.innerHTML = filtered.map(p => `
            <div class="card position-relative">
                <div class="product-image">${p.image ? `<img src="${p.image}" alt="${p.name}">` : '✅'}</div>
                <h3 class="card-title">${p.name}<span class="verified-badge">Проверено</span></h3>
                <p class="card-content">${p.description}</p>
                <div style="font-size: 1.5rem; font-weight: bold; color: var(--primary); margin: 1rem 0;">$${p.price}</div>
                <div class="rating mb-2">${'⭐'.repeat(Math.floor(p.rating))}${'☆'.repeat(5-Math.floor(p.rating))}</div>
                <p class="text-muted" style="font-size: 0.9rem;">${p.reviews} отзывов</p>
                <div class="card-footer">
                    <button class="btn btn-primary btn-small" onclick="showPaymentOptions(${p.id})">Купить</button>
                </div>
            </div>
        `).join('');
    }

    window.showRequestProductOptions = function(productId) {
        if (!currentUser) {
            showErrorMessage('Пожалуйста, авторизуйтесь');
            toggleLoginModal();
            return;
        }
        const product = products.find(p => p.id === productId);
        document.getElementById('requestProductOptions').innerHTML = `
            <div class="payment-option">
                <h4>💳 Оформить карту банка</h4>
                <p>Деньги переводятся сразу, товар доставляется 3-5 дней</p>
                <button class="btn btn-primary" onclick="submitProductRequest(${productId}, 'card')">Оформить карту</button>
            </div>
            <div class="payment-option">
                <h4>⏰ Оплатить сейчас, получить оплату через 3 дня</h4>
                <p>Деньги отправляются сразу, как отправите отзыв и чек</p>
                <button class="btn btn-secondary" onclick="submitProductRequest(${productId}, 'later')">Получить товар</button>
            </div>
        `;
        document.getElementById('requestProductModal').classList.add('active');
    }

    window.showPaymentOptions = async function(productId) {
        if (!currentUser) {
            showErrorMessage('Пожалуйста, авторизуйтесь');
            toggleLoginModal();
            return;
        }
        const product = verifiedProducts.find(p => p.id === productId);
        document.getElementById('paymentOptions').innerHTML = `
            <div class="payment-option">
                <h4>💳 Оформить карту банка</h4>
                <p>Деньги переводятся сразу, товар доставляется 3-5 дней</p>
                <button class="btn btn-primary" onclick="processPayment(${productId}, 'card')">Оплатить $${product.price}</button>
            </div>
            <div class="payment-option">
                <h4>⏰ Оплатить сейчас, получить оплату через 3 дня</h4>
                <p>Деньги отправляются сразу, как отправите отзыв и чек</p>
                <button class="btn btn-secondary" onclick="processPayment(${productId}, 'later')">Получить товар</button>
            </div>
        `;
        document.getElementById('paymentModal').classList.add('active');
    }

       window.processPayment = async function(productId, method) {
        const product = verifiedProducts.find(p => p.id === productId);
        
        // Сохраняем комиссию если есть реферрер
        if (currentUserData?.referrerId) {
            await addDoc(collection(db, 'commissions'), {
                referrerId: currentUserData.referrerId,
                referredUserId: currentUser.uid,
                productId: productId,
                productName: product.name,
                amount: product.price * 0.05,
                paid: false,
                date: new Date().toISOString()
            });
        }
        
        // Обновляем счётчик товаров
        await updateDoc(doc(db, 'users', currentUser.uid), {
            productsCount: (currentUserData.productsCount || 0) + 1
        });
        
        product.stock--;
        closePaymentModal();
        
        if (method === 'card') {
            showSuccessMessage(`✅ Платёж $${product.price} обработан! Доставка 3-5 дней.`);
        } else {
            showSuccessMessage(`✅ Товар зарезервирован! Отправьте отзыв и чек.`);
        }
    }

    // ===== ТОВАРЫ (локальные) =====
    window.handleAddProduct = function(e) {
        e.preventDefault();
        const imageFile = document.getElementById('productImage').files[0];
        
        function createProduct(image) {
            const newProduct = {
                id: Math.max(...products.map(p => p.id), 0) + 1,
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                description: document.getElementById('productDescription').value,
                url: document.getElementById('productUrl').value,
                image: image,
                rating: 0,
                reviews: 0,
                stock: parseInt(document.getElementById('productStock').value)
            };
            products.push(newProduct);
            toggleAddProductModal();
            showSuccessMessage('✅ Товар успешно добавлен!');
            document.querySelector('#addProductModal form').reset();
            updateAdmin();
        }
        
        if (imageFile) {
            const reader = new FileReader();
            reader.onload = (event) => createProduct(event.target.result);
            reader.readAsDataURL(imageFile);
        } else {
            createProduct(null);
        }
    }

    // ===== ТАБЫ =====
    window.switchTab = function(tabName) {
        document.querySelectorAll('#cabinet .tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('#cabinet .tab-content').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(tabName).classList.add('active');
    }

    window.switchAdminTab = function(tabName) {
        document.querySelectorAll('#admin .tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('#admin .tab-content').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');

    }

    // ===== УТИЛИТЫ =====
    window.copyReferralLink = function() {
        const link = document.getElementById('referralLink').textContent;
        navigator.clipboard.writeText(link);
        showSuccessMessage('📋 Ссылка скопирована!');
    }

    window.showSuccessMessage = function(message) {
        const alert = document.createElement('div');
        alert.className = 'alert alert-success';
        alert.textContent = message;
        alert.style.cssText = 'position:fixed;top:80px;right:20px;z-index:2000;max-width:400px;';
        document.body.appendChild(alert);
        setTimeout(() => alert.remove(), 3000);
    }

    window.showErrorMessage = function(message) {
        const alert = document.createElement('div');
        alert.className = 'alert alert-error';
        alert.textContent = message;
        alert.style.cssText = 'position:fixed;top:80px;right:20px;z-index:2000;max-width:400px;';
        document.body.appendChild(alert);
        setTimeout(() => alert.remove(), 3000);
    }

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    document.addEventListener('DOMContentLoaded', () => {
        // Поиск
        document.getElementById('searchInput')?.addEventListener('input', renderProducts);
        document.getElementById('verifiedSearchInput')?.addEventListener('input', renderVerifiedProducts);
        
        // Проверяем реферальный код в URL
        const urlParams = getUrlParams();
        if (urlParams.ref) {
            showSuccessMessage('🎉 Вы пришли по реферальной ссылке!');
        }
    });

    // Закрытие модалов по клику на фон
    document.addEventListener('click', (e) => {
        if (e.target.classList.contains('modal')) {
            e.target.classList.remove('active');
        }
    });
