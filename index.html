<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Saintmarketology</title>
</head>
<body>

<!-- ФОРМА ВХОДА/РЕГИСТРАЦИИ -->
<div id="loginForm">
  <h2>Войти или зарегистрироваться</h2>
  <input type="email" id="email" placeholder="Email"/>
  <input type="password" id="password" placeholder="Пароль"/>
  <button onclick="login()">Войти</button>
  <button onclick="register()">Регистрация</button>
  <p id="errorMsg" style="color:red"></p>
</div>

<!-- ЛИЧНЫЙ КАБИНЕТ -->
<div id="dashboard" style="display:none">
  <h2>Ваша реферальная ссылка:</h2>
  <p id="refLink"></p>
  <button onclick="copyLink()">Скопировать ссылку</button>
  <h2>Рефералов привлечено: <span id="refCount">0</span></h2>
  <button onclick="logout()">Выйти</button>
</div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  // ВАШИ КЛЮЧИ
  const firebaseConfig = {
    apiKey: "AIzaSyAPaV-LlEBjl-alwt3mawWtAKYFF5uuyJg",
    authDomain: "saintmarketology.firebaseapp.com",
    projectId: "saintmarketology",
    storageBucket: "saintmarketology.firebasestorage.app",
    messagingSenderId: "1098681326401",
    appId: "1:1098681326401:web:3a28423a30b92be88d1fc0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ПОЛУЧИТЬ РЕФЕРЕРА ИЗ URL
  function getReferrer() {
    const params = new URLSearchParams(window.location.search);
    return params.get('ref');
  }

  // ПОКАЗАТЬ КАБИНЕТ
  async function showDashboard(userId) {
    const userData = await getDoc(doc(db, "users", userId));
    const data = userData.data();
    document.getElementById('refLink').textContent = data.referralLink;
    document.getElementById('refCount').textContent = data.referralCount;
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('loginForm').style.display = 'none';
  }

  // РЕГИСТРАЦИЯ
  window.register = async function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      const userCred = await createUserWithEmailAndPassword(auth, email, password);
      const userId = userCred.user.uid;
      const refLink = `https://saintmarketology.github.io/Saintmarketology/?ref=${userId}`;
      
      await setDoc(doc(db, "users", userId), {
        email: email,
        referralLink: refLink,
        referralCount: 0,
        referredBy: getReferrer() || null
      });

      if (getReferrer()) {
        await updateDoc(doc(db, "users", getReferrer()), {
          referralCount: increment(1)
        });
      }

      showDashboard(userId);
    } catch(e) {
      document.getElementById('errorMsg').textContent = e.message;
    }
  }

  // ВХОД
  window.login = async function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch(e) {
      document.getElementById('errorMsg').textContent = e.message;
    }
  }

  // ВЫХОД
  window.logout = async function() {
    await signOut(auth);
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
  }

  // КОПИРОВАТЬ ССЫЛКУ
  window.copyLink = function() {
    const link = document.getElementById('refLink').textContent;
    navigator.clipboard.writeText(link);
    alert('Ссылка скопирована!');
  }

  // АВТОВХОД
  onAuthStateChanged(auth, (user) => {
    if (user) {
      showDashboard(user.uid);
    }
  });

</script>

</body>
</html>
